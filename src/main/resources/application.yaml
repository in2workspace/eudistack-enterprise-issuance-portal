spring:
  application:
    name: eudistack-enterprise-issuance-portal
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/eudistack}
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:}
    hikari:
      # Fail fast with 503 when the database is down instead of holding the request ~30 s.
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:3000}
  # SES SMTP interface, same properties and variables as the wallet. The timeouts keep the 5 s a send may take
  # before the holder is told the mail is unavailable (NFR-1).
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          # Sender of every message, on the platform's verified SES identity.
          # No default: with the smtp provider the service does not start without it.
          from: ${SMTP_FROM:}
          connectiontimeout: ${SMTP_CONNECTION_TIMEOUT_MS:5000}
          timeout: ${SMTP_TIMEOUT_MS:5000}
          writetimeout: ${SMTP_WRITE_TIMEOUT_MS:5000}
          auth: ${SMTP_AUTH:true}
          # Stricter than the wallet: the credentials and the message never travel without TLS, and the
          # server's certificate must be valid for its host. SES presents a public-CA certificate that the
          # JDK truststore validates, so there is no ssl.trust (it would accept any certificate).
          starttls:
            enable: ${SMTP_STARTTLS:true}
            required: true
          ssl:
            enable: ${SMTP_SSL_ENABLE:false}
            checkserveridentity: true
  flyway:
    # Migrations run per tenant schema in TenantSchemaMigrator, never on the default schema.
    enabled: false

server:
  port: ${SERVER_PORT:8080}
  # The forwarded headers are read by the filters of ForwardedHeadersConfiguration: the client's address
  # first, then the public host (the tenant comes from it) and scheme.
  forward-headers-strategy: none
  servlet:
    # The API lives under /issuance-portal/api/v1; health and metrics at /issuance-portal/health and /issuance-portal/prometheus.
    context-path: /issuance-portal

issuance-portal:
  # Filled in from build.gradle when the resources are processed.
  version: "@version@"
  # local, test, dev, stg or pro. No default: the service does not start without it.
  env: ${PORTAL_ENV}
  crypto:
    # kms in AWS environments, local in Docker Compose. Empty: the service does not start.
    provider: ${PORTAL_CRYPTO_PROVIDER:}
    kms-key-id: ${PORTAL_KMS_KEY_ID:}
    local-key: ${PORTAL_LOCAL_DATA_KEY:}
  client-address:
    # Proxies of the platform in front of the service, each appending to X-Forwarded-For: 1 in Docker
    # Compose (nginx), 2 in AWS (CloudFront and the ALB). Empty: the service does not start.
    trusted-proxies: ${PORTAL_TRUSTED_PROXIES:}
  portal-config:
    # How long a valid portal configuration is cached (design.md AD-7).
    cache-ttl: 5m
  authentic-source:
    # Searches of the authentic source in flight per instance and per tenant; beyond either a check
    # answers 503 at once. Both at least 1, or the service does not start.
    max-concurrent-lookups: ${PORTAL_AUTHENTIC_SOURCE_MAX_LOOKUPS:100}
    max-concurrent-lookups-per-tenant: ${PORTAL_AUTHENTIC_SOURCE_MAX_LOOKUPS_PER_TENANT:20}
  public-host:
    # The tenant's public host, {tenant} replaced by the tenant, e.g. {tenant}.127.0.0.1.nip.io:4443 locally.
    # Sent as X-Forwarded-Host (with X-Forwarded-Proto https) to the Verifier and the Issuer, so each resolves
    # its public address: the token's iss and the Location of an issuance are built from it.
    template: ${PORTAL_PUBLIC_HOST_TEMPLATE:}
  system-token:
    # How the portal asks the tenant's Verifier for its token as a system (design.md AD-5).
    # ssm in AWS environments, file in Docker Compose. Empty: the service does not start.
    provider: ${PORTAL_SYSTEM_TOKEN_PROVIDER:}
    # ssm provider: the tenant's SecureString parameter in SSM Parameter Store, {tenant} replaced by the tenant,
    # e.g. /eudistack/dev/config/apps/issuance-portal/machine-credential/{tenant}. Its value is JSON with
    # credential (the machine credential's JWT) and privateKey (the mandatee's P-256 key, as a JWK or hex).
    parameter-template: ${PORTAL_SYSTEM_TOKEN_PARAMETER_TEMPLATE:}
    # file provider: folder with one <tenant>.json per tenant, with the same content.
    directory: ${PORTAL_SYSTEM_TOKEN_DIRECTORY:}
    # The Verifier on the internal network, with its context path, e.g. http://verifier:8082/verifier.
    verifier-internal-url: ${PORTAL_VERIFIER_INTERNAL_URL:}
    # How long the Verifier gets to answer.
    request-timeout: 5s
  issuance-api:
    # The Issuer on the internal network, with its context path, e.g. http://issuer-service:8080/issuer.
    issuer-internal-url: ${PORTAL_ISSUER_INTERNAL_URL:}
    # How long the Issuer gets to answer each call (EC-07).
    request-timeout: 10s
    # Wait before the first retry when the Issuer sends no Retry-After; it doubles on each retry (1, 2, 4 s).
    retry-initial-wait: 1s
    # A 503 is retried only when this is on: until the Issuer shares its idempotency between instances
    # (EUD-254) a retry may create another process. Network errors and timeouts are always retried.
    retry-on-503: ${PORTAL_ISSUANCE_RETRY_ON_503:false}
    # Resilience towards the Issuer, each tenant on its own (SEC-25, SEC-27). The waits between retries
    # carry a random variation of up to 50 % so that parallel confirmations do not retry together.
    # Issuance calls of a tenant in progress at once, retries included; another one gets 503 issuance_unavailable
    # without a request to the Issuer.
    max-concurrent-per-tenant: ${PORTAL_ISSUANCE_MAX_CONCURRENT_PER_TENANT:20}
    # The circuit opens when this percentage of the last circuit-minimum-calls attempts failed (network
    # errors, timeouts and 5xx; a 4xx is not a failure). While open, the Issuer is not called.
    circuit-failure-rate-percent: 50
    circuit-minimum-calls: 10
    # After this wait one call goes through to the Issuer: if it succeeds the circuit closes.
    circuit-wait-in-open-state: 30s
  wallet-unit-service:
    # How long the tenant's Wallet Unit Service gets to answer the onboarding ticket; never retried (design.md §3.4).
    request-timeout: 5s
  mail:
    # smtp in every environment that sends mail, local where none is sent. Empty: the service does not start.
    provider: ${PORTAL_MAIL_PROVIDER:}

management:
  health:
    # The health of the service does not depend on the SMTP server: a mail outage must not restart the task.
    mail:
      enabled: false
  endpoints:
    web:
      # At the root of the service, as in the other platform services: /issuance-portal/health.
      base-path: /
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  # Trace and span ids are always created, so every log line and error carries them.
  # Export is opt-in: in AWS the ADOT sidecar sends spans to X-Ray (conv-observability §4).
  tracing:
    sampling:
      probability: ${OTEL_TRACES_SAMPLER_ARG:1.0}
    propagation:
      type: w3c
  otlp:
    tracing:
      export:
        enabled: ${OTEL_TRACES_EXPORT_ENABLED:false}
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
  metrics:
    distribution:
      # p95 of each journey step is an NFR (< 300 ms).
      percentiles-histogram:
        http.server.requests: true

logging:
  level:
    es.in2.issuanceportal: ${LOG_LEVEL:INFO}
