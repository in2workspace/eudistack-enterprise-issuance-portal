spring:
  application:
    name: eudistack-enterprise-issuance-portal
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/eudistack}
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:}
    hikari:
      # Fail fast with 503 when the database is down instead of holding the request ~30 s.
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:3000}
  flyway:
    # Migrations run per tenant schema in TenantSchemaMigrator, never on the default schema.
    enabled: false

server:
  port: ${SERVER_PORT:8080}
  # The forwarded headers are read by the filters of ForwardedHeadersConfiguration: the client's address
  # first, then the public host (the tenant comes from it) and scheme.
  forward-headers-strategy: none
  servlet:
    # The API lives under /issuance-portal/api/v1; health and metrics at /issuance-portal/health and /issuance-portal/prometheus.
    context-path: /issuance-portal

issuance-portal:
  # Filled in from build.gradle when the resources are processed.
  version: "@version@"
  # local, test, dev, stg or pro. No default: the service does not start without it.
  env: ${PORTAL_ENV}
  crypto:
    # kms in AWS environments, local in Docker Compose. Empty: the service does not start.
    provider: ${PORTAL_CRYPTO_PROVIDER:}
    kms-key-id: ${PORTAL_KMS_KEY_ID:}
    local-key: ${PORTAL_LOCAL_DATA_KEY:}
  client-address:
    # Proxies of the platform in front of the service, each appending to X-Forwarded-For: 1 in Docker
    # Compose (nginx), 2 in AWS (CloudFront and the ALB). Empty: the service does not start.
    trusted-proxies: ${PORTAL_TRUSTED_PROXIES:}
  portal-config:
    # How long a valid portal configuration is cached (design.md AD-7).
    cache-ttl: 5m
  authentic-source:
    # Searches of the authentic source in flight per instance and per tenant; beyond either a check
    # answers 503 at once. Both at least 1, or the service does not start.
    max-concurrent-lookups: ${PORTAL_AUTHENTIC_SOURCE_MAX_LOOKUPS:100}
    max-concurrent-lookups-per-tenant: ${PORTAL_AUTHENTIC_SOURCE_MAX_LOOKUPS_PER_TENANT:20}
  system-token:
    # How the portal asks the tenant's Verifier for its token as a system (design.md AD-5).
    # secrets-manager in AWS environments, file in Docker Compose. Empty: the service does not start.
    provider: ${PORTAL_SYSTEM_TOKEN_PROVIDER:}
    # Secrets Manager provider: the tenant's secret, {tenant} replaced by the tenant. The secret is JSON with
    # clientId (the machine credential's did:key), credential (its JWT) and privateKey (the mandatee's P-256 JWK).
    secret-name-template: ${PORTAL_SYSTEM_TOKEN_SECRET_TEMPLATE:}
    # File provider: folder with one <tenant>.json per tenant, with the same content.
    directory: ${PORTAL_SYSTEM_TOKEN_DIRECTORY:}
    # The Verifier on the internal network, with its context path, e.g. http://verifier:8082/verifier.
    verifier-internal-url: ${PORTAL_VERIFIER_INTERNAL_URL:}
    # The tenant's public host, {tenant} replaced by the tenant, e.g. {tenant}.127.0.0.1.nip.io:4443 locally.
    # Sent as X-Forwarded-Host (with X-Forwarded-Proto https) so the Verifier resolves its public address.
    public-host-template: ${PORTAL_PUBLIC_HOST_TEMPLATE:}
    # How long the Verifier gets to answer.
    request-timeout: 5s
  incidents:
    mail:
      # ses in AWS environments, local in Docker Compose. Empty: the service does not start.
      provider: ${PORTAL_MAIL_PROVIDER:}
      # Sender on the platform's verified SES identity, e.g. noreply@mail.stg.eudistack.net.
      from: ${PORTAL_MAIL_FROM:}

management:
  endpoints:
    web:
      # At the root of the service, as in the other platform services: /issuance-portal/health.
      base-path: /
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  # Trace and span ids are always created, so every log line and error carries them.
  # Export is opt-in: in AWS the ADOT sidecar sends spans to X-Ray (conv-observability §4).
  tracing:
    sampling:
      probability: ${OTEL_TRACES_SAMPLER_ARG:1.0}
    propagation:
      type: w3c
  otlp:
    tracing:
      export:
        enabled: ${OTEL_TRACES_EXPORT_ENABLED:false}
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
  metrics:
    distribution:
      # p95 of each journey step is an NFR (< 300 ms).
      percentiles-histogram:
        http.server.requests: true

logging:
  level:
    es.in2.issuanceportal: ${LOG_LEVEL:INFO}
