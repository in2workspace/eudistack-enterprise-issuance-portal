# Test overrides, layered on top of src/main/resources/application.yaml.
issuance-portal:
  env: test
  crypto:
    provider: local
    # Test-only key, never used outside the test suite.
    local-key: VV4OSyWM8BydULUYWMb92hUKKZZWmlYXo3TTa/7BDhI=
  # Tests run the expiry sweep explicitly, never on the minute.
  expiry:
    enabled: false
  # MockMvc requests set their address directly. ClientAddressIT checks the proxies on its own context.
  client-address:
    trusted-proxies: 0
  # Tests share one context: no cached configuration from one test may answer for another.
  # JdbcPortalConfigRepositoryIT checks the five-minute cache on its own instance.
  portal-config:
    cache-ttl: 0s
  # No machine credential is mounted and no Verifier listens: the system token has its own tests.
  public-host:
    template: "{tenant}.127.0.0.1.nip.io:4443"
  system-token:
    provider: file
    directory: build/tmp/system-token-test
    verifier-internal-url: http://localhost:9/verifier
  # No Issuer listens: the issuance API client has its own tests.
  issuance-api:
    issuer-internal-url: http://localhost:9/issuer
  incidents:
    mail:
      provider: local
      from: noreply@mail.test.eudistack.net
